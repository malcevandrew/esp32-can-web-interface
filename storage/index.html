<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Motion Control Panel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Distributed Motion System <span class="badge">Master</span></h1>
            <div class="net-status">
                <span>WebSocket Link: </span>
                <span id="ws-state" class="status-offline">DISCONNECTED</span>
            </div>
        </header>

        <main class="dashboard">
            <!-- КАРТОЧКА ШАГОВОГО МОТОРА -->
            <section class="card">
                <h2>STEPPER CONTROLLER</h2>
                <div class="telemetry-rows">
                    <p>State: <span id="step-state" class="accent">UNKNOWN</span></p>
                    <p>Position(mm): <span id="step-pos">0</span></p>
                    <p>Target(mm): <span id="step-tgt">0</span></p>
                    <p>Error: <span id="step-err" class="status-ok">NONE</span></p>
                </div>
                <div class="control-actions">
                    <label>Target position (0..170mm):</label>
                    <input type="number" id="step-input" min="0" max="170" value="100">
                    <div class="btn-group">
                        <button id="btn-goto" onclick="sendMove('stepper', 'goto')">GOTO</button>
                        <button id="btn-home" onclick="sendCmd('stepper', 'home')">HOME</button>
                        <button onclick="sendCmd('stepper', 'stop')" class="btn-danger">STOP</button>
                    </div>

                    <!-- НОВЫЙ БЛОК: СЕРИЙНАЯ ПРОГРАММА ПЕРЕМЕЩЕНИЙ -->
                    <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                        <label style="font-weight: bold;">Sequence:</label>
                        <input type="text" id="prog-input" value="20, 60, 15, 120" style="margin-bottom: 10px; width: 260px; font-size: 14pt;">
                        <div class="btn-group">
                            <button id="btn-start-prog" onclick="startAutomatedProgram()" style="background-color: #28a745; color: white;">START SEQUENCE</button>
                            <button id="btn-stop-prog" onclick="stopAutomatedProgram()" class="btn-danger">STOP SEQUENCE</button>
                        </div>
                        <div id="prog-status-block" style="margin-top: 10px; font-size: 13px; color: #555; display: none; background: #f8f9fa; padding: 8px; border-radius: 4px; text-align: center;">
                            Execution: step <span id="prog-current-step" style="font-weight: bold; color: #007bff;">0</span> of <span id="prog-total-steps" style="font-weight: bold;">0</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/app.js"></script>
</body>
</html>
